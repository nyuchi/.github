# Composite action: does a pull request write a version the org versioning
# policy allows? The logic behind .github/workflows/release-version-check.yml
# (nyuchi/.github#90), kept here so that workflow stays a thin wrapper.
#
#   Into `staging`               PATCH  x.y.z -> x.y.(z+1)
#   Into the default branch      MINOR  x.y.z -> x.(y+1).0
#   MAJOR                        only with the `semver:major` label
#
# The policy itself is next-version.mjs (nyuchi/.github#80), called here as
# is; nothing in this file restates it.
#
# It is a required check, so it FAILS CLOSED: whatever it cannot positively
# verify, it refuses. Any API failure is a hard error asking for a re-run.
#
# What it does:
#
#   1. Confirms the PR's base and head commits exist in the repo (a fork's
#      head commit is reachable there too), then reads every version file
#      read-version.mjs knows (package.json, Cargo.toml, pyproject.toml,
#      VERSION) at both through the contents API. After that, a 404 means the
#      file is absent. Nothing from the PR is checked out or run.
#   2. read-version.mjs assess reads each entry (package.json, each TOML
#      table through Python's tomllib, VERSION) on both sides as absent,
#      valid or invalid. Valid means exactly MAJOR.MINOR.PATCH, each 0..999
#      (next-version.mjs isStrictVersion, the one parser shared with the
#      policy and the Nyuchi App); nothing is trimmed, and a duplicate key or
#      a file tomllib refuses is invalid. Per entry:
#        invalid    the head value is invalid and differs from the base
#        removed    a real version (not 0.0.0) at the base is gone, reset to
#                   0.0.0 or broken at the head
#        downgrade  the head is lower than a real base version
#        check      the head is a real version and differs from the base
#                   (new or changed): `next-version.mjs check` against the
#                   highest version tag decides; all must pass
#      invalid, removed and downgrade are refused, always. Removing or
#      resetting a version (a version moving into code, say) needs an owner
#      bypass of the check.
#   3. Nothing to do: the PR writes no version. It passes, and the summary
#      shows the version the merge will be tagged with, or says it cannot be
#      predicted when there is no version tag.
#
# A version tag is a tag named exactly <prefix><strict version>; any other
# tag, pre-releases included, is ignored (so is an out-of-range one like
# v2024.10.1). 0.0.0 is a placeholder in every file and is never checked as a
# release. With no tags at all, the first version written is held to the
# same rule from 0.0.0: 0.0.1 on staging, 0.1.0 on main, or 1.0.0 with the
# label. A repo with tags but no version tag (another scheme, or only
# pre-releases) cannot be verified: a PR that writes or changes a version
# there is refused, and one that writes none passes.
#
# Every answer read from a script is checked before it is used: the
# read-version output starts with its header line, `count` is a number,
# `highest` is a strict version and a passing `check` gives a reason. A
# missing or malformed answer is a hard error.
#
# The channel is `main` when the PR targets the repo's default branch and
# `staging` for any other base.
#
# The `semver:major` label is read from the PR through the API when the job
# runs, not from the event payload, so adding the label and pressing
# "Re-run" is enough.
#
# Every value from the event arrives through an input and an env var, never
# through `${{ }}` inside the script, so no PR title, branch name or label
# can inject shell. Versions are only printed once they hold nothing but
# version characters.
#
# Reads with `token` (contents: read and pull-requests: read on the repo).
# Writes nothing but the step summary.

name: Release version check
description: Check the version a pull request writes against the org versioning policy.

inputs:
  base-ref:
    description: Branch the PR targets (github.event.pull_request.base.ref).
    required: true
  base-sha:
    description: Base commit (github.event.pull_request.base.sha).
    required: true
  head-sha:
    description: Head commit (github.event.pull_request.head.sha).
    required: true
  default-branch:
    description: The repo's default branch (github.event.repository.default_branch).
    required: true
  pr-number:
    description: The PR's number, to read its labels. Empty reads no labels.
    required: false
    default: ""
  repository:
    description: owner/repo of the PR.
    required: false
    default: ${{ github.repository }}
  tag-prefix:
    description: Prefix of the version tags.
    required: false
    default: v
  token:
    description: Token that can read the repo's contents, tags and PR labels.
    required: false
    default: ${{ github.token }}

outputs:
  result:
    description: "'unchanged' or 'allowed' (the step fails otherwise)."
    value: ${{ steps.run.outputs.result }}
  version:
    description: The versions the PR writes, space-separated (empty when none).
    value: ${{ steps.run.outputs.version }}

runs:
  using: composite
  steps:
    - id: run
      shell: bash
      env:
        BASE_REF: ${{ inputs.base-ref }}
        BASE_SHA: ${{ inputs.base-sha }}
        HEAD_SHA: ${{ inputs.head-sha }}
        DEFAULT_BRANCH: ${{ inputs.default-branch }}
        PR_NUMBER: ${{ inputs.pr-number }}
        REPO: ${{ inputs.repository }}
        PREFIX: ${{ inputs.tag-prefix }}
        GH_TOKEN: ${{ inputs.token }}
        LIB: ${{ github.action_path }}/../next-version
      run: |
        set -euo pipefail
        summary() { printf '%s\n' "$@" >> "$GITHUB_STEP_SUMMARY"; }
        die() { echo "::error title=Release version check::$1"; exit 1; }

        channel=staging
        [ "$BASE_REF" = "$DEFAULT_BRANCH" ] && channel=main

        # The label is read now, not from the event, so a re-run sees it. A
        # failed read stops the check: it never quietly means "no label".
        allow_major=false
        if [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
          labels="$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/labels" --jq '.[].name')" \
            || die "Could not read the PR's labels; re-run the check."
          if grep -qxF 'semver:major' <<<"$labels"; then allow_major=true; fi
        fi

        # Both commits must exist before a 404 on a file can mean "absent".
        for sha in "$BASE_SHA" "$HEAD_SHA"; do
          gh api "repos/$REPO/commits/$sha" --jq .sha > /dev/null \
            || die "Could not find commit $sha in $REPO; re-run the check."
        done

        # fetch <sha> <path> <out>: 0 = got it, 1 = not there.
        fetch() {
          local err="$RUNNER_TEMP/rvc-err"
          if gh api -H "Accept: application/vnd.github.raw" \
            "repos/$REPO/contents/$2?ref=$1" > "$3" 2> "$err"; then
            return 0
          fi
          rm -f "$3"
          if grep -q 'HTTP 404' "$err"; then return 1; fi
          cat "$err" >&2
          die "Could not read $2 at $1 in $REPO; re-run the check."
        }

        # read-version's answers start with a header line; anything else
        # (empty, cut short, a script that did not run) is a hard error.
        # header <expected> <output>
        header() {
          [ "${2%%$'\n'*}" = "$1" ] || die "read-version gave no answer ('$1' missing); re-run the check."
        }

        base_dir="$RUNNER_TEMP/rvc-base"
        head_dir="$RUNNER_TEMP/rvc-head"
        rm -rf "$base_dir" "$head_dir"
        mkdir -p "$base_dir" "$head_dir"
        files_out="$(node "$LIB/read-version.mjs" files)" \
          || die "read-version failed (see the log); re-run the check."
        header '# read-version files v1' "$files_out"
        files="$(sed 1d <<<"$files_out")"
        [ -n "$files" ] || die "read-version listed no version files."
        while IFS= read -r f; do
          fetch "$BASE_SHA" "$f" "$base_dir/$f" || true
          fetch "$HEAD_SHA" "$f" "$head_dir/$f" || true
        done <<<"$files"
        # entry <TAB> invalid|removed|downgrade|check <TAB> base <TAB> head
        assess_out="$(node "$LIB/read-version.mjs" assess "$base_dir" "$head_dir")" \
          || die "read-version could not read the version files (see the log); re-run the check."
        header '# read-version assess v1' "$assess_out"
        todo="$(sed 1d <<<"$assess_out")"

        # All tags. A version tag is exactly <prefix><strict version>
        # (next-version.mjs); the count tells "no version tags" apart from a
        # real v0.0.0.
        refs="$(gh api --paginate "repos/$REPO/git/matching-refs/tags" --jq '.[].ref')" \
          || die "Could not read the repo's tags; re-run the check."
        version_tags="$(printf '%s\n' "$refs" | node "$LIB/next-version.mjs" count --prefix "$PREFIX")" \
          || die "next-version count failed; re-run the check."
        [[ "$version_tags" =~ ^[0-9]+$ ]] || die "next-version count gave no number; re-run the check."
        current="$(printf '%s\n' "$refs" | node "$LIB/next-version.mjs" highest --prefix "$PREFIX")" \
          || die "next-version highest failed; re-run the check."
        node "$LIB/next-version.mjs" strict --version "$current" > /dev/null \
          || die "next-version highest gave no version; re-run the check."
        has_tags=false
        [ "$version_tags" -gt 0 ] && has_tags=true
        # Tags, but none a version tag (another scheme, or only
        # pre-releases): no version can be verified.
        untagged=false
        [ -n "$refs" ] && [ "$version_tags" -eq 0 ] && untagged=true
        highest_shown="\`$PREFIX$current\`"
        [ "$version_tags" -eq 0 ] && highest_shown=none

        summary "## Release version check" "" \
          "| | |" "|---|---|" \
          "| Channel | \`$channel\` (base \`$BASE_REF\`, default \`$DEFAULT_BRANCH\`) |" \
          "| Highest tag | $highest_shown |" \
          "| semver:major | $allow_major |" ""

        if [ -z "$todo" ]; then
          echo "version=" >> "$GITHUB_OUTPUT"
          echo "result=unchanged" >> "$GITHUB_OUTPUT"
          if [ "$untagged" = true ]; then
            # Tags in another scheme, or only pre-releases: no promise.
            summary "This PR writes no new version. The next version cannot be" \
              "predicted from these tags: none is a \`$PREFIX<MAJOR.MINOR.PATCH>\` version tag."
            echo "No version change in this PR; the next version cannot be predicted from these tags."
          elif next="$(node "$LIB/next-version.mjs" next --current "$current" \
              --channel "$channel" 2>&1)"; then
            summary "This PR writes no new version. When it merges, the merge is" \
              "tagged \`$PREFIX$next\` (the next $channel version after $highest_shown)."
            echo "No version change in this PR; the merge will be tagged $PREFIX$next."
          else
            next="${next#::error::}"
            summary "This PR writes no new version, but the policy has no next" \
              "version for it: $next"
            echo "::warning::No version change in this PR, but: $next"
          fi
          if [ "$allow_major" = true ]; then
            summary "" "The \`semver:major\` label only matters for a PR that writes a major version."
          fi
          exit 0
        fi

        summary "| Entry | Base | Head | Result |" "|---|---|---|---|"
        written=""
        failed=0
        while IFS=$'\t' read -r entry action base head; do
          [ "$head" = '!invalid' ] || [ "$head" = - ] || written="${written:+$written }$head"
          case "$action" in
            invalid)
              ok=false why="the head does not hold a version (MAJOR.MINOR.PATCH, each 0..999, nothing else)." ;;
            removed)
              ok=false why="version removed or reset ($base at the base). That needs an owner bypass of this check." ;;
            downgrade)
              ok=false why="$head is lower than $base, the version at the base." ;;
            check)
              if [ "$untagged" = true ]; then
                ok=false
                why="this repo's tags don't follow $PREFIX<MAJOR.MINOR.PATCH>, so the version can't be verified;"
                why="$why tag releases as $PREFIX<version>."
              elif why="$(node "$LIB/next-version.mjs" check --current "$current" \
                  --proposed "$head" --channel "$channel" \
                  --allow-major "$allow_major" --has-tags "$has_tags" 2>&1)"; then
                [ -n "$why" ] || die "next-version check passed without a reason; re-run the check."
                ok=true
              else
                ok=false
                why="${why#::error::}"
                case "$why" in
                  *"bump: major"*) why="$why On a pull request, the semver:major label allows a major." ;;
                esac
              fi ;;
            *)
              ok=false why="unknown action '$action'." ;;
          esac
          if [ "$ok" = true ]; then
            summary "| $entry | $base | $head | allowed ($why) |"
            echo "$entry: $base -> $head after $current on $channel: allowed ($why)."
          else
            failed=$((failed + 1))
            summary "| $entry | $base | $head | **refused**: $why |"
            echo "::error title=Release version check::$entry: $why"
          fi
        done <<<"$todo"
        echo "version=$written" >> "$GITHUB_OUTPUT"

        if [ "$failed" -gt 0 ]; then
          summary "" "Set each refused entry to the version the policy allows, or leave the" \
            "version alone and let the merge be tagged. A major needs the \`semver:major\` label."
          exit 1
        fi
        echo "result=allowed" >> "$GITHUB_OUTPUT"
