# Composite action: the org's versioning policy.
#
#   Merge into `staging`       PATCH  x.y.z -> x.y.(z+1)
#   Release `staging` -> main  MINOR  x.y.z -> x.(y+1).0
#   MAJOR                      manual only: workflow_dispatch with bump: major
#
# Each segment holds 0..999. Patch 999 rolls into the next minor; minor 999
# is refused, with a message asking for a manual major. The rules live in
# next-version.mjs beside this file, with its tests.
#
# Two modes, both decided by next-version.mjs `decide` (the same decision
# release-version-check makes; this action only fetches tags and writes
# outputs):
#
#   next   (no `proposed`)  The next version for `channel`, or for `bump`
#                           when a person overrides it.
#   check  (`proposed` set) The version is written in the repo (package.json,
#                           Cargo.toml, ...). The step fails unless it is
#                           the current, tagged version or the one the policy
#                           allows next; a downgrade to an old tag fails.
#
# The current version is the higher of the highest version tag (a tag named
# exactly <prefix><strict version>; v2024.10.1 is out of range and ignored)
# and `current-from-files`, the version the repo already writes, so files
# ahead of the tags never deadlock a repo. With the default prefix, a repo
# with tags but no version tag cannot be verified: check fails, next starts
# from the files or 0.0.1. With another prefix (a monorepo component), other
# tags are ignored. A proposed version must be strict (MAJOR.MINOR.PATCH,
# each 0..999).
#
# Usage, pinned to a commit like every org action:
#
#   - id: v
#     uses: nyuchi/.github/.github/actions/next-version@<40-hex>  # main, <date>
#     with:
#       channel: main
#       bump: ${{ inputs.bump }}                 # '' on automatic runs
#       manual: ${{ github.event_name == 'workflow_dispatch' }}
#   - run: echo "${{ steps.v.outputs.version }}"
#
# Reads tags through the API with `token` (default: the run's GITHUB_TOKEN,
# which needs only contents: read). Needs no checkout and writes nothing.

name: Next version
description: Compute or check the next version under the org versioning policy.

inputs:
  channel:
    description: "'staging' (patch) or 'main' (minor)."
    required: true
  bump:
    description: "Override: patch, minor or major. Empty takes the channel's default."
    required: false
    default: ""
  manual:
    description: "'true' when a person started the run. Required for a major."
    required: false
    default: "false"
  proposed:
    description: Version written in the repo. Set it to check instead of compute.
    required: false
    default: ""
  current:
    description: Highest released version. Empty reads it from the repo's tags.
    required: false
    default: ""
  current-from-files:
    description: >-
      The highest version the repo already writes. The current version is
      the higher of it and the highest version tag (both modes). Empty:
      tags only.
    required: false
    default: ""
  tag-prefix:
    description: Prefix of the version tags.
    required: false
    default: v
  repository:
    description: owner/repo whose tags are read.
    required: false
    default: ${{ github.repository }}
  token:
    description: Token that can read the repo's tags.
    required: false
    default: ${{ github.token }}

outputs:
  current:
    description: Highest released version before this one (0.0.0 if none).
    value: ${{ steps.run.outputs.current }}
  version:
    description: The next version (next mode) or the checked version (check mode).
    value: ${{ steps.run.outputs.version }}
  tag:
    description: tag-prefix + version.
    value: ${{ steps.run.outputs.tag }}

runs:
  using: composite
  steps:
    - id: run
      shell: bash
      env:
        CHANNEL: ${{ inputs.channel }}
        BUMP: ${{ inputs.bump }}
        MANUAL: ${{ inputs.manual }}
        PROPOSED: ${{ inputs.proposed }}
        CURRENT: ${{ inputs.current }}
        FROM_FILES: ${{ inputs.current-from-files }}
        PREFIX: ${{ inputs.tag-prefix }}
        REPO: ${{ inputs.repository }}
        GH_TOKEN: ${{ inputs.token }}
        SCRIPT: ${{ github.action_path }}/next-version.mjs
      run: |
        set -euo pipefail
        die() { echo "::error::$1"; exit 1; }
        # strict <version>: a strict version echoes itself; anything else
        # (or no answer) is not one.
        strict() {
          local out
          out="$(node "$SCRIPT" strict --version "$1")" || return 1
          [ "$out" = "$1" ]
        }

        # Every decision is next-version.mjs `decide`, the one
        # release-version-check makes too; this script only fetches tags and
        # writes outputs. Tags: ALL of the repo's (not prefix-filtered), or
        # the given `current` as if it were the only tag.
        if [ -n "$CURRENT" ]; then
          strict "$CURRENT" || die "The current version is not MAJOR.MINOR.PATCH (each 0..999)."
          refs="refs/tags/$PREFIX$CURRENT"
        else
          refs="$(gh api --paginate "repos/$REPO/git/matching-refs/tags" --jq '.[].ref')"
        fi
        args=(--channel "$CHANNEL" --prefix "$PREFIX" --bump "$BUMP" --manual "$MANUAL")
        mode=compute
        if [ -n "$PROPOSED" ]; then
          mode=check
          args+=(--proposed "$PROPOSED")
        fi
        args+=(--mode "$mode")
        if [ -n "$FROM_FILES" ]; then args+=(--from-files "$FROM_FILES"); fi

        if ! out="$(printf '%s\n' "$refs" | node "$SCRIPT" decide "${args[@]}" 2>&1)"; then
          reason="${out#::error::}"
          die "${reason:-next-version decide refused without a reason.}"
        fi
        echo "decide $mode: $out"
        ok_re='^ok ([^ ]+) ([^ ]+) (.+)$'
        [[ "$out" =~ $ok_re ]] || die "next-version decide gave no answer."
        version="${BASH_REMATCH[1]}" current="${BASH_REMATCH[2]}" why="${BASH_REMATCH[3]}"
        if ! strict "$version" || ! strict "$current"; then
          die "next-version decide gave a bad version."
        fi
        echo "Version $current -> $version on $CHANNEL${BUMP:+ (bump: $BUMP)}: $why."
        {
          echo "current=$current"
          echo "version=$version"
          echo "tag=$PREFIX$version"
        } >> "$GITHUB_OUTPUT"
