# Tests for the composite actions in .github/actions/, and for the bump logic in
# reusable-trunk-release.yml.
#
# next-version holds the org's versioning policy (patch on staging, minor on
# main, major by hand, no minor/patch cap), and read-version.mjs beside it reads a
# repo's version from package.json, Cargo.toml, pyproject.toml or VERSION;
# their tests run on Node's built-in runner, with no install step.
# version-fixtures.test.mjs feeds every entry of version-fixtures.json (the
# table the Nyuchi App also tests against) to the strict parser, every
# version-file reader and the CLI, which must all agree.
#
# release-version-check runs the action's script against a fake gh in
# test.sh (refused and allowed versions, labels, tag schemes, version files),
# then runs the action itself on this repo's own merge commit, which writes no
# version, so it must pass as "unchanged".
#
# rust-only-lint proves the Node-free path for Rust-only repos (owner,
# 2026-11-17) gives the same answer as the Node path: the standalone oxfmt
# against the oxfmt vite-plus bundles, and markdownlint-cli2 under Deno
# against the same version under Node, on this repo's own files. Same pins as reusable-vite-plus.yml and
# reusable-lint.yml.
#
# trunk-release-bump extracts the "Decide the bump" step's script from
# reusable-trunk-release.yml and runs it on sample PR titles: feat is a minor,
# everything else a patch, a breaking change is refused, and a manual override
# wins.

name: Test actions

on:
  pull_request:
    paths:
      - ".github/workflows/reusable-vite-plus.yml"
      - ".github/workflows/reusable-lint.yml"
      - ".github/actions/**"
      - ".github/workflows/reusable-trunk-release.yml"
      - ".github/workflows/release-version-check.yml"
      - ".github/workflows/test-actions.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/reusable-vite-plus.yml"
      - ".github/workflows/reusable-lint.yml"
      - ".github/actions/**"
      - ".github/workflows/reusable-trunk-release.yml"
      - ".github/workflows/release-version-check.yml"
      - ".github/workflows/test-actions.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  next-version:
    name: next-version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Unit tests
        run: >-
          node --test
          .github/actions/next-version/next-version.test.mjs
          .github/actions/next-version/read-version.test.mjs
          .github/actions/next-version/version-fixtures.test.mjs
      - name: The action computes from this repo's tags
        id: next
        uses: ./.github/actions/next-version
        with:
          channel: staging
      - name: The action checks a proposed version
        uses: ./.github/actions/next-version
        with:
          channel: main
          current: 0.27.3
          proposed: 0.28.0
      - name: Show
        env:
          CURRENT: ${{ steps.next.outputs.current }}
          VERSION: ${{ steps.next.outputs.version }}
        run: echo "Tags say $CURRENT; the next staging version is $VERSION."

  release-version-check:
    name: release-version-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Refusal and pass paths, against a fake gh
        run: bash .github/actions/release-version-check/test.sh
      - name: Main gate accepts releases and hotfixes only, against a fake gh
        run: bash .github/actions/release-version-check/test-main-gate.sh
      - name: A commit with no version file passes as unchanged
        id: rvc
        uses: ./.github/actions/release-version-check
        with:
          base-ref: staging
          base-sha: ${{ github.sha }}
          head-sha: ${{ github.sha }}
          default-branch: main
      - name: Result
        env:
          RESULT: ${{ steps.rvc.outputs.result }}
        run: test "$RESULT" = unchanged

  rust-only-lint:
    name: rust-only lint path matches the Node path
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed  # v2.0.5
        with:
          deno-version: v2.x
      - name: Install both oxfmt builds and markdownlint-cli2 for Node
        shell: bash
        run: |
          set -euo pipefail
          t="$RUNNER_TEMP"
          npm install --prefix "$t/vp" --no-audit --no-fund vite-plus@1.0.0
          npm install --prefix "$t/mdl" --no-audit --no-fund markdownlint-cli2@0.23.2
          curl -fsSL --retry 3 -o "$t/oxfmt.tgz" \
            https://github.com/oxc-project/oxc/releases/download/oxfmt_v0.70.0/oxfmt-x86_64-unknown-linux-gnu.tar.gz
          echo "7c1051238203be82eb7ed6038a9a72ac258ee15d79510e71ea32665df6b7af9f  $t/oxfmt.tgz" | sha256sum --check --strict
          tar -xzf "$t/oxfmt.tgz" -C "$t"
          echo "bundled: $("$t/vp/node_modules/.bin/oxfmt" --version)  standalone: $("$t/oxfmt-x86_64-unknown-linux-gnu" --version)"
      - name: The standalone oxfmt agrees with the bundled one
        shell: bash
        run: |
          set -uo pipefail
          t="$RUNNER_TEMP"
          mapfile -d '' files < <(git ls-files -z -- '*.md' '*.mdx' '*.json' '*.jsonc')
          opts=(--check --config .oxfmtrc.json --ignore-path .prettierignore)
          a=0; "$t/vp/node_modules/.bin/oxfmt" "${opts[@]}" "${files[@]}" > "$t/a.txt" 2>&1 || a=$?
          b=0; "$t/oxfmt-x86_64-unknown-linux-gnu" "${opts[@]}" "${files[@]}" > "$t/b.txt" 2>&1 || b=$?
          echo "bundled exit $a, standalone exit $b"
          if [ "$a" != "$b" ]; then
            echo "::error::The standalone oxfmt and the bundled oxfmt disagree."
            diff "$t/a.txt" "$t/b.txt" || true
            exit 1
          fi
      - name: markdownlint-cli2 under Deno agrees with Node
        shell: bash
        run: |
          set -uo pipefail
          t="$RUNNER_TEMP"
          a=0; "$t/mdl/node_modules/.bin/markdownlint-cli2" '**/*.md' '!**/node_modules/**' > "$t/c.txt" 2>&1 || a=$?
          b=0; deno run --allow-read --allow-env --allow-sys npm:markdownlint-cli2@0.23.2 \
            '**/*.md' '!**/node_modules/**' > "$t/d.txt" 2>&1 || b=$?
          echo "Node exit $a, Deno exit $b"
          if [ "$a" != "$b" ]; then
            echo "::error::markdownlint-cli2 under Deno and under Node disagree on this repo."
            echo "--- Node"; cat "$t/c.txt"
            echo "--- Deno"; cat "$t/d.txt"
            exit 1
          fi

  fmt-nothing-to-format:
    name: fmt passes when there is nothing to format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: The fmt check step, on a Rust-only repo, in five shapes
        shell: bash
        run: |
          set -euo pipefail
          t="$RUNNER_TEMP"
          curl -fsSL --retry 3 -o "$t/oxfmt.tgz" \
            https://github.com/oxc-project/oxc/releases/download/oxfmt_v0.70.0/oxfmt-x86_64-unknown-linux-gnu.tar.gz
          echo "7c1051238203be82eb7ed6038a9a72ac258ee15d79510e71ea32665df6b7af9f  $t/oxfmt.tgz" | sha256sum --check --strict
          tar -xzf "$t/oxfmt.tgz" -C "$t"
          oxfmt="$t/oxfmt-x86_64-unknown-linux-gnu"
          org="$GITHUB_WORKSPACE"
          script="$t/fmt-check.sh"
          yq -e '.jobs.fmt.steps[] | select(.id == "run") | .run' \
            .github/workflows/reusable-vite-plus.yml > "$script"
          test -s "$script"

          fails=0
          # expect <pass|fail> <description>: runs the step in the current repo, as
          # the Node-free path does (RUST_ONLY=true), which has the canonical config
          # and ignore file copied in untracked (what the fallback step does), unless
          # the case tracked its own.
          expect() {
            local want=$1 desc=$2 got=pass
            RUST_ONLY=true OXFMT="$oxfmt" PATHSPECS="*.md *.mdx *.json *.jsonc" bash "$script" > "$t/out.txt" 2>&1 || got=fail
            if [ "$got" = "$want" ]; then
              echo "ok   - $desc ($got)"
            else
              echo "::error::$desc: wanted $want, got $got"
              cat "$t/out.txt"
              fails=$((fails + 1))
            fi
          }
          repo() {
            rm -rf "$t/case" && mkdir "$t/case" && cd "$t/case"
            git init -q . && printf '[package]\nname = "x"\nversion = "0.0.0"\n' > Cargo.toml
            cp "$org/.oxfmtrc.json" "$org/.prettierignore" .
            git add Cargo.toml
          }

          # 1. Only Markdown, as in nyuchi/aragorn: the standalone oxfmt formats none of
          #    it and exits 2 ("Expected at least one target file"); nothing it can
          #    check, so the step passes with a notice (this used to fail).
          repo; printf '# Title\n\nText.\n' > README.md; printf '# Agents\n' > AGENTS.md; git add README.md AGENTS.md
          expect pass "only Markdown matches the pathspecs"

          # 2. Nothing but a lockfile under *.json, which the org's .prettierignore
          #    excludes: nothing to format, so it passes (this used to exit 2 as well).
          repo; printf '{}\n' > package-lock.json; git add package-lock.json
          expect pass "only an ignored lockfile matches the pathspecs"

          # 3. The repo's own tracked .prettierignore excludes every JSON file it
          #    has: a gate that inspects nothing still fails.
          repo; printf '{ "a": 1 }\n' > data.json; printf 'data.json\n' > .prettierignore
          git add data.json .prettierignore -f
          expect fail "the repo's own .prettierignore excludes every matching file"

          # 4. Formatting is still enforced where the standalone oxfmt can do it:
          #    a formatted JSON file passes, an unformatted one fails, with
          #    Markdown alongside it left to markdownlint.
          repo; printf '{ "a": 1 }\n' > data.json; printf '# Title\n\n\n\nText.   \n' > README.md; git add data.json README.md
          expect pass "a formatted JSON file next to an unformatted README.md"
          printf '{"a":1,\n"b":[1,2]}\n' > data.json
          expect fail "an unformatted JSON file is still reported"

          [ "$fails" -eq 0 ] || { echo "$fails fmt case(s) failed."; exit 1; }

  trunk-release-bump:
    name: trunk-release bump
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: The bump follows the PR title
        run: |
          set -euo pipefail
          script="$RUNNER_TEMP/bump.sh"
          yq -e '.jobs.release.steps[] | select(.id == "bump") | .run' \
            .github/workflows/reusable-trunk-release.yml > "$script"
          test -s "$script"

          fails=0
          # expect <patch|minor|major|fail> <titles> <override> <label>
          expect() {
            local want="$1" titles="$2" override="$3" label="$4" got out
            : > "$RUNNER_TEMP/out"
            if out="$(TITLES="$titles" OVERRIDE="$override" MANUAL=false \
              GITHUB_OUTPUT="$RUNNER_TEMP/out" bash "$script" 2>&1)"; then
              got="$(sed -n 's/^bump=//p' "$RUNNER_TEMP/out")"
            else
              got=fail
              grep -q '^::error::' <<<"$out" || got="fail without ::error::"
            fi
            if [ "$got" = "$want" ]; then
              echo "ok   $label ($got)"
            else
              echo "FAIL $label: wanted $want, got $got"
              fails=$((fails + 1))
            fi
          }

          expect patch "fix: handle empty input" "" "fix is a patch"
          expect patch "chore(deps): bump the all group" "" "a scoped chore is a patch"
          expect patch "docs: explain the flow" "" "docs is a patch"
          expect patch "Update README" "" "a title that is not conventional is a patch"
          expect patch "" "" "no title is a patch"
          expect minor "feat: add the export button" "" "feat is a minor"
          expect minor "feat(api): add the export endpoint" "" "a scoped feat is a minor"
          expect minor $'fix: a\nfeat: b' "" "one feat among fixes makes a minor"
          expect fail "feat!: drop the old API" "" "a breaking feat is refused"
          expect fail "fix(api)!: change the response shape" "" "a scoped breaking fix is refused"
          expect minor "fix: a patch" minor "an override of minor wins"
          expect major "fix: a patch" major "an override of major wins"
          expect patch "feat: a feature" patch "an override of patch wins"
          exit "$fails"
