# Reusable workflow: strict lint (the org's standard lint policy).
#
# Call from a caller workflow in any repo under nyuchi:
#
#   name: Lint
#   on:
#     pull_request:
#     push:
#       branches: [main]
#   jobs:
#     lint:
#       uses: nyuchi/.github/.github/workflows/reusable-lint.yml@main
#
# Every job is BLOCKING. The required-status-checks list in your
# repo's main-branch ruleset should include all five job names:
#   actionlint, JSON validity, prettier, markdownlint, yamllint
#
# The reusable does NOT auto-fix anything. When a check fails,
# the developer fixes locally (`prettier --write`,
# `markdownlint-cli2 --fix`, manual yamllint fix) and pushes
# the corrected commit.
#
# Each consuming repo SHOULD ship .prettierrc, .prettierignore,
# .yamllint.yaml and .markdownlint.jsonc at its root - copy them
# verbatim from nyuchi/.github. A repo's own config always wins. Where
# one is missing, each job fetches the canonical copy from nyuchi/.github
# at the same commit as this workflow (job.workflow_sha) and says
# so in a ::notice::, so a repo covered only by an org-required workflow
# still lints against the org standard. Prettier is invoked with an explicit
# --config .prettierrc --ignore-path .prettierignore, so those two files
# at the repo ROOT are the only ones that apply - a nested .prettierrc in
# a sub-app cannot redefine the org gate, and .gitignore cannot hide a
# file from it. The other tools auto-discover from the repo root.
#
# CROSS-ORG USE: this repo is public, and a public reusable workflow can
# be called from any repository, including a private one in a different
# org. That is proven in production - private bundu-labs/marketing calls
# this file and publishes all five contexts green. So there is exactly
# ONE copy of the org lint policy, at nyuchi/.github, for all five orgs
# (nyuchi, mzizi-dev, shamwari-ai, mukoko-dev, bundu-labs). Do not fork
# it into the other .github repos - divergent copies are the problem
# this file exists to end.
#
# The caller must grant `contents: read` (the workflow default).

name: Reusable / Lint

on:
  workflow_call:
    inputs:
      prettier-glob:
        description: Glob passed to `prettier --check`.
        type: string
        default: "**/*.{md,mdx,json,jsonc}"
      markdownlint-globs:
        description: Newline-separated globs for markdownlint-cli2.
        type: string
        default: |
          **/*.md
          !**/node_modules/**
      yamllint-target:
        description: Path passed to `yamllint`.
        type: string
        default: "."
      actionlint-paths:
        description: Space-separated globs for actionlint.
        type: string
        default: ".github/workflows/*.yml"
      prettier-version:
        type: string
        default: "3.9.4"
      yamllint-version:
        type: string
        default: "1.38.0"
      markdownlint-version:
        description: >-
          markdownlint-cli2 version. PINNED ON PURPOSE: the
          markdownlint-cli2-action floats its bundled ruleset, so a newer
          rule (MD060) fired in CI while local installs stayed quiet.
          Pin the same version in your repo's devDependencies so
          `npx markdownlint-cli2` locally and CI agree exactly.
        type: string
        default: "0.23.2"
      prettier:
        description: >-
          Run the prettier job. Set false only in an org that has moved to
          reusable-vite-plus.yml AND removed `lint / prettier` from its
          required checks (MIGRATION in that file). A skipped job reports as
          skipped, which satisfies nothing new.
        type: boolean
        default: true
      json-validity:
        description: >-
          Run the JSON validity job. Same rule as `prettier`: false only
          after `vite-plus / fmt` is required in the org's ruleset.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
      - name: Download actionlint
        id: get_actionlint
        shell: bash
        run: |
          set -euo pipefail
          installer=$(mktemp)
          trap 'rm -f "$installer"' EXIT
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 2 \
            https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash \
            --output "$installer"
          # Sanity-check we got a shell script, not an HTML error page.
          head -n 1 "$installer" | grep -qE '^#!.*(bash|sh)' \
            || { echo "::error::actionlint installer did not look like a shell script"; head -n 5 "$installer"; exit 1; }
          bash "$installer" 1.7.12
      - name: actionlint
        env:
          ACTIONLINT_BIN: ${{ steps.get_actionlint.outputs.executable }}
          ACTIONLINT_PATHS: ${{ inputs.actionlint-paths }}
        shell: bash
        run: |
          set -euo pipefail
          # Expand the glob list ourselves: a repo whose only lint comes from the
          # org-required workflow may have no workflow files at all, and a literal
          # unmatched glob makes actionlint fail. Nothing to lint is a pass.
          shopt -s nullglob
          # Intentional word-splitting: $ACTIONLINT_PATHS is a space-separated glob list.
          # shellcheck disable=SC2206
          files=($ACTIONLINT_PATHS)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::notice::No workflow files match '$ACTIONLINT_PATHS'; nothing for actionlint to check."
            exit 0
          fi
          "$ACTIONLINT_BIN" -color "${files[@]}"

  jsonlint:
    name: JSON validity
    if: ${{ inputs.json-validity }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
      - name: Validate every JSON and JSONC file
        # Two parsers, chosen by filename, because ".json" is two formats.
        #
        # `-type f` is load-bearing: framework routers create DIRECTORIES
        # whose name ends in .json (e.g. a Next.js App Router segment
        # `app/.well-known/mcp/server-card.json/route.ts`). Without it
        # json.load() raises IsADirectoryError and this job can never pass.
        #
        # Some filenames ending in .json are JSONC *by specification* -
        # TypeScript documents and supports `//` comments in tsconfig.json,
        # as do VS Code's settings files and devcontainer.json. Parsing
        # those with strict JSON is simply the wrong parser, and "fixing"
        # it by deleting the comments destroys real information. They are
        # parsed as JSONC instead. A genuine syntax error in a tsconfig
        # still fails - nothing is exempted, the gate got wider.
        run: |
          set -euo pipefail
          python3 - <<'VALIDATE_JSON'
          import json, os, re, sys

          # Filenames that are JSONC by specification, not by accident.
          JSONC_NAMES = {"devcontainer.json", ".eslintrc.json"}
          JSONC_PREFIXES = ("tsconfig", "jsconfig")

          def is_jsonc(path):
              base = os.path.basename(path)
              if base.endswith(".jsonc") or base in JSONC_NAMES:
                  return True
              if base.endswith(".json") and base.startswith(JSONC_PREFIXES):
                  return True
              parts = path.replace(os.sep, "/").split("/")
              return ".vscode" in parts and base.endswith(".json")

          def scan(text, handler):
              """Walk text, calling handler outside string literals only."""
              out = []
              i, n = 0, len(text)
              in_str = esc = False
              while i < n:
                  c = text[i]
                  if in_str:
                      out.append(c)
                      if esc:
                          esc = False
                      elif c == "\\":
                          esc = True
                      elif c == '"':
                          in_str = False
                      i += 1
                      continue
                  if c == '"':
                      in_str = True
                      out.append(c)
                      i += 1
                      continue
                  i = handler(text, i, out, n)
              return "".join(out)

          def drop_comments(text, i, out, n):
              c = text[i]
              if c == "/" and i + 1 < n and text[i + 1] == "/":
                  while i < n and text[i] not in "\r\n":
                      i += 1
                  return i
              if c == "/" and i + 1 < n and text[i + 1] == "*":
                  i += 2
                  while i + 1 < n and not (text[i] == "*" and text[i + 1] == "/"):
                      if text[i] in "\r\n":
                          out.append(text[i])  # keep line numbers honest
                      i += 1
                  return i + 2
              out.append(c)
              return i + 1

          def drop_trailing_commas(text, i, out, n):
              if text[i] == ",":
                  j = i + 1
                  while j < n and text[j] in " \t\r\n":
                      j += 1
                  if j < n and text[j] in "}]":
                      out.append(" ")
                      return i + 1
              out.append(text[i])
              return i + 1

          def parse_jsonc(text):
              # Comments MUST go first: a trailing comma may be separated
              # from its closing brace by a comment, as in
              # `{ "a": true, /* note */ }`.
              return scan(scan(text, drop_comments), drop_trailing_commas)

          # ---- .jsonlintignore -------------------------------------------
          # Every other check in this gate has an ignore mechanism: actionlint
          # takes paths, prettier reads .prettierignore, markdownlint takes
          # globs, yamllint has its own `ignore:`. JSON validity had none, so a
          # repo with legitimately non-conformant JSON had nowhere to say so
          # except by editing the caller - which breaks the one rule that the
          # caller is byte-identical everywhere.
          #
          # siafudb-kuzu is the case: a vendored KuzuDB fork whose test corpus
          # holds Delta Lake `_delta_log/*.json` transaction logs, which are
          # newline-delimited BY SPECIFICATION, gzipped `.gz.metadata.json`
          # Iceberg fixtures, and a file named `newline-delimited.json` that
          # exists to test an NDJSON reader. For several of those, being
          # invalid as a single JSON document IS the fixture's purpose.
          #
          # Absent by default, so the other 74 repos are unaffected. The file
          # is printed verbatim and a skip count reported on EVERY run, so an
          # over-broad pattern is visible in the log rather than hidden - which
          # is exactly how a `.prettierignore` containing only `*` survived in
          # nhimbe and made that gate incapable of failing.
          def load_ignore(path=".jsonlintignore"):
              if not os.path.isfile(path):
                  print("No .jsonlintignore; every JSON file is checked.")
                  return []
              raw = open(path, encoding="utf-8").read()
              print("::group::.jsonlintignore (verbatim)")
              print(raw.rstrip("\n"))
              print("::endgroup::")
              pats = []
              for line in raw.splitlines():
                  line = line.strip()
                  if line and not line.startswith("#"):
                      pats.append(line)
              return pats

          def pat_to_re(pat):
              neg = pat.startswith("!")
              if neg:
                  pat = pat[1:]
              anchored = pat.startswith("/")
              pat = pat.lstrip("/")
              dironly = pat.endswith("/")
              pat = pat.rstrip("/")
              out, i, n = [], 0, len(pat)
              while i < n:
                  c = pat[i]
                  if pat.startswith("**/", i):
                      out.append("(?:.*/)?"); i += 3
                  elif pat.startswith("**", i):
                      out.append(".*"); i += 2
                  elif c == "*":
                      out.append("[^/]*"); i += 1
                  elif c == "?":
                      out.append("[^/]"); i += 1
                  else:
                      out.append(re.escape(c)); i += 1
              body = "".join(out)
              prefix = "" if anchored else "(?:.*/)?"
              tail = "/.*" if dironly else "(?:/.*)?"
              return neg, re.compile("^" + prefix + body + tail + "$")

          def make_matcher(pats):
              rules = [pat_to_re(p) for p in pats]
              def ignored(rel):
                  hit = False
                  for neg, rx in rules:
                      if rx.match(rel):
                          hit = not neg
                  return hit
              return ignored

          ignored = make_matcher(load_ignore())

          status = 0
          checked = jsonc_count = skipped = 0
          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in (".git", "node_modules")]
              for name in sorted(files):
                  if not (name.endswith(".json") or name.endswith(".jsonc")):
                      continue
                  path = os.path.join(root, name)
                  # os.walk lists a DIRECTORY named *.json under dirs, not
                  # files, but a symlink to one lands here - so still check.
                  if not os.path.isfile(path):
                      continue
                  rel = os.path.relpath(path, ".").replace(os.sep, "/")
                  if ignored(rel):
                      skipped += 1
                      continue
                  checked += 1
                  try:
                      raw = open(path, encoding="utf-8-sig").read()
                  except UnicodeDecodeError as exc:
                      print("::error file=%s::not valid UTF-8: %s" % (rel, exc))
                      status = 1
                      continue
                  jsonc = is_jsonc(path)
                  if jsonc:
                      jsonc_count += 1
                  try:
                      json.loads(parse_jsonc(raw) if jsonc else raw)
                  except json.JSONDecodeError as exc:
                      print("::error file=%s,line=%d::invalid %s: %s"
                            % (rel, exc.lineno, "JSONC" if jsonc else "JSON", exc.msg))
                      status = 1
          print("Checked %d JSON files (%d parsed as JSONC by specification); "
                "skipped %d via .jsonlintignore." % (checked, jsonc_count, skipped))

          # A .jsonlintignore that leaves NOTHING to check has turned this job
          # into a no-op that reports success - the exact shape of nhimbe's
          # `.prettierignore` containing only `*`, which made that gate
          # incapable of failing for months. This is not a tunable threshold;
          # there is nothing to tune. Either the check checks something, or it
          # is not a check. A repo with no JSON files at all is fine, because
          # then nothing was skipped either.
          if checked == 0 and skipped > 0:
              print("::error::.jsonlintignore excluded every JSON file in the "
                    "repository (%d skipped, 0 checked). A gate that inspects "
                    "nothing cannot fail. Narrow the patterns." % skipped)
              status = 1

          sys.exit(status)
          VALIDATE_JSON
  prettier:
    name: prettier
    if: ${{ inputs.prettier }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
      - name: Fall back to the org prettier config
        # Only the ROOT .prettierrc counts: the check below passes --config
        # .prettierrc explicitly, so a prettier.config.js is not a substitute.
        env:
          # job.workflow_sha is the commit of THIS reusable workflow (not the
          # caller's - that is github.workflow_sha). actionlint 1.7.12 does
          # not know the property yet, so it is read through
          # fromJSON(toJSON(job)); an empty or malformed value falls back to
          # main below.
          ORG_CONFIG_REF: ${{ fromJSON(toJSON(job)).workflow_sha }}
          # One line per config: the file to fetch, then any other names
          # the tool also reads. If ANY of them exists, the repo's own
          # config is used and nothing is fetched.
          ORG_CONFIGS: |
            .prettierrc
            .prettierignore
        shell: bash
        run: |
          set -euo pipefail
          ref="${ORG_CONFIG_REF:-}"
          if [[ ! "$ref" =~ ^[0-9a-f]{40}$ ]]; then
            ref=main
          fi
          while read -r canonical alternates; do
            [ -n "$canonical" ] || continue
            own=""
            # Intentional word-splitting: $alternates is a space-separated list.
            # shellcheck disable=SC2086
            for f in "$canonical" $alternates; do
              if [ -e "$f" ]; then own="$f"; break; fi
            done
            if [ -n "$own" ]; then
              echo "Using the repo's own $own."
              continue
            fi
            curl --fail --silent --show-error --location \
              --retry 3 --retry-delay 2 \
              "https://raw.githubusercontent.com/nyuchi/.github/$ref/$canonical" \
              --output "$canonical"
            echo "::notice::$canonical is missing from the repo root; using the canonical copy from nyuchi/.github@$ref."
          done <<< "$ORG_CONFIGS"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: '24'
      - name: Install prettier
        env:
          PRETTIER_VERSION: ${{ inputs.prettier-version }}
        shell: bash
        run: |
          set -euo pipefail
          # Validate version to guard against injection via inputs.prettier-version.
          if [[ ! "$PRETTIER_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.]+)?$ ]]; then
            echo "::error::Invalid prettier-version '$PRETTIER_VERSION' — expected semver."
            exit 1
          fi
          npm install --global "prettier@$PRETTIER_VERSION"
      - name: Audit .gitignore for shadowed lint targets
        # Prettier 3 reads BOTH .gitignore and .prettierignore by default.
        # mukoko-home's .gitignore contained `claude.md`, which silently
        # exempted the tracked CLAUDE.md from `prettier --check` - the job
        # went green without ever looking at the file. We defeat that below
        # by passing --ignore-path explicitly; this step makes the
        # near-miss visible instead of leaving it as folklore.
        env:
          PRETTIER_GLOB: ${{ inputs.prettier-glob }}
        shell: bash
        run: |
          set -euo pipefail
          shadowed=$(git ls-files | git check-ignore --no-index --stdin || true)
          if [ -n "$shadowed" ]; then
            echo "::notice::These tracked files match a .gitignore pattern."
            echo "They ARE linted, because --ignore-path below is explicit."
            printf '%s\n' "$shadowed"
          else
            echo "No tracked file is shadowed by .gitignore."
          fi
      - name: prettier --check
        # BOTH --config and --ignore-path are passed EXPLICITLY, and for the
        # same reason: this job must use the ORG's prettier settings, not
        # whatever it happens to auto-discover.
        #
        # --ignore-path, because Prettier 3 also reads .gitignore, and a
        # tracked file matching a .gitignore pattern was silently skipped -
        # a no-op gate for exactly the files someone tried to hide.
        #
        # --config, because prettier resolves a NESTED .prettierrc per file.
        # nyuchi-identity's apps/auth-ui is a SvelteKit app whose own
        # .prettierrc names prettier-plugin-svelte. This job installs
        # prettier globally and never runs `npm ci`, so that plugin is not
        # installed, and walking into that directory killed the ENTIRE job -
        # not just the subtree. Any monorepo with a per-app prettier config
        # naming a plugin does the same.
        #
        # Pinning the root config also means one markdown/JSON dialect per
        # repo, which is the whole point. An app keeps its own .prettierrc
        # for its own scripts and editors; it just does not get to redefine
        # the org gate from a subdirectory.
        env:
          PRETTIER_GLOB: ${{ inputs.prettier-glob }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .prettierrc ]; then
            echo "::error::.prettierrc is missing from the repo root."
            echo "Copy it from nyuchi/.github - see ADOPTING-LINT.md step 2."
            exit 1
          fi
          prettier --check \
            --config .prettierrc \
            --ignore-path .prettierignore \
            "$PRETTIER_GLOB"

  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
      - name: Fall back to the org markdownlint config
        env:
          # job.workflow_sha is the commit of THIS reusable workflow (not the
          # caller's - that is github.workflow_sha). actionlint 1.7.12 does
          # not know the property yet, so it is read through
          # fromJSON(toJSON(job)); an empty or malformed value falls back to
          # main below.
          ORG_CONFIG_REF: ${{ fromJSON(toJSON(job)).workflow_sha }}
          # One line per config: the file to fetch, then any other names
          # the tool also reads. If ANY of them exists, the repo's own
          # config is used and nothing is fetched.
          # Folded (>-), so these names are ONE line: one config, many names.
          ORG_CONFIGS: >-
            .markdownlint.jsonc
            .markdownlint-cli2.jsonc .markdownlint-cli2.yaml
            .markdownlint-cli2.cjs .markdownlint-cli2.mjs
            .markdownlint.json .markdownlint.yaml .markdownlint.yml
            .markdownlint.cjs .markdownlint.mjs
        shell: bash
        run: |
          set -euo pipefail
          ref="${ORG_CONFIG_REF:-}"
          if [[ ! "$ref" =~ ^[0-9a-f]{40}$ ]]; then
            ref=main
          fi
          while read -r canonical alternates; do
            [ -n "$canonical" ] || continue
            own=""
            # Intentional word-splitting: $alternates is a space-separated list.
            # shellcheck disable=SC2086
            for f in "$canonical" $alternates; do
              if [ -e "$f" ]; then own="$f"; break; fi
            done
            if [ -n "$own" ]; then
              echo "Using the repo's own $own."
              continue
            fi
            curl --fail --silent --show-error --location \
              --retry 3 --retry-delay 2 \
              "https://raw.githubusercontent.com/nyuchi/.github/$ref/$canonical" \
              --output "$canonical"
            echo "::notice::$canonical is missing from the repo root; using the canonical copy from nyuchi/.github@$ref."
          done <<< "$ORG_CONFIGS"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6
        with:
          node-version: '24'
      - name: Install markdownlint-cli2
        # Deliberately NOT markdownlint-cli2-action. The action pins its
        # own bundled markdownlint-cli2, so bumping the action changed the
        # active ruleset underneath us and MD060 started failing in CI
        # while `npx markdownlint-cli2` locally still passed. Installing an
        # explicit version makes "what CI runs" a number a developer can
        # copy into their own devDependencies.
        env:
          MARKDOWNLINT_VERSION: ${{ inputs.markdownlint-version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$MARKDOWNLINT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.]+)?$ ]]; then
            echo "::error::Invalid markdownlint-version '$MARKDOWNLINT_VERSION' - expected semver."
            exit 1
          fi
          npm install --global "markdownlint-cli2@$MARKDOWNLINT_VERSION"
          echo "markdownlint-cli2 $(markdownlint-cli2 --version 2>&1 | head -n 1)"
      - name: markdownlint-cli2
        env:
          MARKDOWNLINT_GLOBS: ${{ inputs.markdownlint-globs }}
        shell: bash
        run: |
          set -euo pipefail
          globs=()
          while IFS= read -r glob; do
            [ -n "$glob" ] && globs+=("$glob")
          done <<< "$MARKDOWNLINT_GLOBS"
          if [ ${#globs[@]} -eq 0 ]; then
            echo "::error::markdownlint-globs resolved to nothing."
            exit 1
          fi
          markdownlint-cli2 "${globs[@]}"

  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v6
      - name: Fall back to the org yamllint config
        env:
          # job.workflow_sha is the commit of THIS reusable workflow (not the
          # caller's - that is github.workflow_sha). actionlint 1.7.12 does
          # not know the property yet, so it is read through
          # fromJSON(toJSON(job)); an empty or malformed value falls back to
          # main below.
          ORG_CONFIG_REF: ${{ fromJSON(toJSON(job)).workflow_sha }}
          # One line per config: the file to fetch, then any other names
          # the tool also reads. If ANY of them exists, the repo's own
          # config is used and nothing is fetched.
          ORG_CONFIGS: |
            .yamllint.yaml .yamllint .yamllint.yml
        shell: bash
        run: |
          set -euo pipefail
          ref="${ORG_CONFIG_REF:-}"
          if [[ ! "$ref" =~ ^[0-9a-f]{40}$ ]]; then
            ref=main
          fi
          while read -r canonical alternates; do
            [ -n "$canonical" ] || continue
            own=""
            # Intentional word-splitting: $alternates is a space-separated list.
            # shellcheck disable=SC2086
            for f in "$canonical" $alternates; do
              if [ -e "$f" ]; then own="$f"; break; fi
            done
            if [ -n "$own" ]; then
              echo "Using the repo's own $own."
              continue
            fi
            curl --fail --silent --show-error --location \
              --retry 3 --retry-delay 2 \
              "https://raw.githubusercontent.com/nyuchi/.github/$ref/$canonical" \
              --output "$canonical"
            echo "::notice::$canonical is missing from the repo root; using the canonical copy from nyuchi/.github@$ref."
          done <<< "$ORG_CONFIGS"
      - name: Install yamllint
        env:
          YAMLLINT_VERSION: ${{ inputs.yamllint-version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$YAMLLINT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.]+)?$ ]]; then
            echo "::error::Invalid yamllint-version '$YAMLLINT_VERSION' — expected semver."
            exit 1
          fi
          pip install "yamllint==$YAMLLINT_VERSION"
      - name: yamllint (strict)
        env:
          YAMLLINT_TARGET: ${{ inputs.yamllint-target }}
        shell: bash
        run: |
          set -euo pipefail
          # Intentional word-splitting: $YAMLLINT_TARGET may be a space-separated list of paths.
          # shellcheck disable=SC2086
          yamllint -s -f github $YAMLLINT_TARGET
